<div class="exam-details">
  @if (loading) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading exam...</p>
    </div>
  } @else if (exam) {
    <div class="card">
      <h1>{{ exam.title }}</h1>
      <p>
        {{ exam.description }}
      </p>
      <div class="info">
        <span>
          Questions:
          {{ exam.questionsCount || 0 }}
        </span>
        <span>
          Duration:
          {{ exam.time }} min
        </span>
      </div>
      <button (click)="startExam()">Start Exam</button>
    </div>
  } @else {
    <div class="loading-state">
      <h2>Exam not found</h2>
    </div>
  }
</div>
